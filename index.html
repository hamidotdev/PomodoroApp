<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="timer">25:00</div>
        <h1 class="title">We start the timer</h1>
        <div class="buttons">
            <button class="startBtn" style="--clr:#008000">START</button>
            <button class="resumeBtn" style="--clr: #ff0000">RESUME</button>
            <button class="pauseBtn" style="--clr: #5151db">PAUSE </button>
            <button class="resetBtn" style="--clr: #ffa500">RESET</button>
        </div>
        <div class="pomoCountsDisplay">
            <span class="count">0</span>
            <p>Pomodoro Completed</p>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
